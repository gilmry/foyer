; Variante fpm de la cible. PHP servi sous l'identité du compte, comme chez un hébergeur mutualisé : seul ce compte lit
; la configuration de l'instance (droits 600).
[global]
error_log = /var/log/php-fpm.log
daemonize = yes

[kit]
user = repet
group = repet
listen = /run/kit-fpm.sock
listen.owner = repet
listen.group = repet
listen.mode = 0600
pm = static
pm.max_children = 4
catch_workers_output = yes
clear_env = yes
