; OPcache actif avec ses réglages par défaut (revalidation toutes les 2 s) : la bascule du lien
; `courant` doit se voir sans redémarrer PHP. Fuseau volontairement différent d'UTC.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
expose_php = On
display_errors = Off
log_errors = On
date.timezone = Europe/Paris
