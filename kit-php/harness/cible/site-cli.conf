# Site « PHP » de la cible, montage mod_fcgid + php-cgi (celui relevé chez l'hébergeur). La racine
# pointe sur le lien `courant` de l'instance, dossier public/.
# AllowOverride FileInfo seulement : l'hébergeur accorde davantage (All), le .htaccess du kit ne
# doit rien exiger de plus que le minimum.
# L'en-tête Authorization N'EST PAS transmis à PHP par mod_fcgid (pas de CGIPassAuth ici) : c'est
# au .htaccess du kit de le faire passer, sinon le jeton porteur n'arrive jamais.
ServerName 127.0.0.1
FcgidMaxProcesses 4
FcgidMaxProcessesPerClass 4
FcgidMinProcessesPerClass 4
FcgidIOTimeout 60
<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/ssl/kit/cert.pem
    SSLCertificateKeyFile /etc/ssl/kit/key.pem
    DocumentRoot /home/repet/kit/courant/public
    <Directory /home/repet>
        Options FollowSymLinks ExecCGI
        AllowOverride FileInfo
        Require all granted
        AddHandler fcgid-script .php
        FcgidWrapper /usr/local/bin/php-cgi-kit .php
    </Directory>
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
