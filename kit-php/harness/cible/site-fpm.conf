# Site « PHP » de la cible, montage mod_proxy_fcgi + PHP-FPM (variante). La racine pointe sur le lien `courant` de l'instance, dossier public/.
# AllowOverride FileInfo seulement : le .htaccess du kit ne doit rien exiger de plus.
# L'en-tête Authorization N'EST PAS transmis à PHP par ce serveur : c'est au .htaccess du kit de
# le faire passer (sinon le jeton porteur n'arrive jamais).
ServerName 127.0.0.1
<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/ssl/kit/cert.pem
    SSLCertificateKeyFile /etc/ssl/kit/key.pem
    DocumentRoot /home/repet/kit/courant/public
    <Directory /home/repet>
        Options FollowSymLinks
        AllowOverride FileInfo
        Require all granted
    </Directory>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/kit-fpm.sock|fcgi://localhost"
    </FilesMatch>
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
