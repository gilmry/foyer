[package]
name = "todo-kit-actix"
version = "0.1.0"
edition = "2021"

[lib]
name = "todo"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "integration"
path = "src/bin/integration.rs"

[dependencies]
actix-web = "4"
actix-files = "0.6"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "chrono", "macros"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
