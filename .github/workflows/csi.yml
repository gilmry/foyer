name: CSI rétroactif

on:
  push:
    paths: ["tools/csi/**", ".github/workflows/csi.yml"]
  pull_request:
    paths: ["tools/csi/**", ".github/workflows/csi.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests de csi_retro (gate, 0 = vert)
        run: python3 -m unittest tools/csi/test_csi_retro.py
